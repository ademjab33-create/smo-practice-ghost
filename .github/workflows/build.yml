name: build

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace pixelkiri/devkitpro-alpine-switch:latest sh -c '
            apk add --no-cache bash make cmake
            make -j$(nproc)
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PracticeMod_1.3
          path: |
            build/subsdk9
            build/subsdk9.nss
            build/subsdk9.npdm